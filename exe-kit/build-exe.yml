name: Build Windows EXE

# 手动触发：仓库页面 → Actions → Build Windows EXE → Run workflow
# 打标签触发：git tag v0.1.3 && git push origin v0.1.3（会自动创建 Release）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于产物文件名，可留空）'
        required: false
        default: 'v0.1.3'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6"

      - name: 运行单元测试（打包前拦截明显回归）
        run: python -m unittest discover -s tests -v

      - name: 构建单文件 exe
        run: python -m PyInstaller --noconfirm --clean "钓鱼经验机.spec"

      - name: 校验产物存在
        shell: pwsh
        run: |
          $exe = "dist/钓鱼经验机.exe"
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "构建产物大小: $([math]::Round($size/1MB,1)) MiB"
          if ($size -lt 5MB) { throw "产物过小（$size 字节），疑似打包不完整" }

      - name: 生成发布用文件名
        id: naming
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = "${{ github.ref_name }}" }
          if (-not $ver) { $ver = "dev" }
          $out = "delta-fishing-assistant-$ver-windows-x64.exe"
          Copy-Item "dist/钓鱼经验机.exe" "dist/$out"
          "artifact=$out" >> $env:GITHUB_OUTPUT
          Write-Host "发布文件名: $out"

      - name: 上传构建产物（Actions 页面可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: fishing-assistant-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: 打标签时自动创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
